      tools_20_4: f88cb78cf283e5e84ebf1fec2f6dd07d3e16827c
      merge_to_20_port: 6afed972ad72f347cc7184df7b0494e62403454a
      not_the_demo: >
        The demo loader (_demo_pwm_stamp_role_rules) always gives both dates. The blank lines
        on fx8_20_4e (Procurement Special: periods 14, 15, 17) were saved from the form at
        16:07:48, next to dated lines.
      cause: >
        In the editable period list Enter saves the row and opens a new blank one; a second
        Enter saves that blank row. Both dates are optional, so it is stored and shows as
        "∞ - ∞ ⚡". Such a line fits every moment, so it keeps the rule active for ever and
        makes the dated periods of that rule pointless. Reproduced in Chromium on fx8_20_4:
        fill one period, press Enter three times -> 2 blank periods saved. Core behaviour and
        the same view on 19.0, so not a port regression.
      fix: >
        security.role.rule.create/write drop NEW (0,0,{}) period lines with no start and no
        end when the rule has a dated period (already stored or in the same save); a rule
        with only blank lines keeps one. Lines that already exist are never touched, no
        migration, direct period.create is unchanged, open-ended periods (start only or end
        only) stay.
      tests: >
        7 tests in security_user_roles/tests/test_rule_periods.py: 5 fail on the old model,
        all pass on the fix (0 failed of 9 on a scratch DB). Same Enter pattern in Chromium
        after the fix: one dated period saved.
      review_dbs: >
        fx8_20_4 and fx8_20_4e restarted (Python change). On fx8_20_4e the 3 blank lines
        were deleted (owner's test rules 3 and 4 keep their dated periods, no blank period
        is left on either DB).
      still_true: >
