incidents:
  - id: image_stale_19_addons
    found: 2026-09-12
    phase: 4.1
    blocks: "every group's Gx.6 / Gx.7 on faotools/env-demo-20:current"
    symptom: >
      complementary_employee_data install dies on
      FileNotFoundError: /usr/lib/python3/dist-packages/addons/hr_homeworking/security/security.xml.
      hr_homeworking does not exist at saas-19.4 at all; it is auto_install=True, so anything
      pulling hr installs a module upstream deleted.
    cause: >
      env-serie-image.sh writes the saas-19.4 tree into /usr/lib/python3/dist-packages/odoo/addons
      (owner odoo, 664 entries, has base, no hr_homeworking) but leaves the Debian-packaged 19.0
      tree at /usr/lib/python3/dist-packages/addons (owner root, dated with the base image), which
      is ALSO on the addons path. Different inodes for addons/sale/__manifest__.py vs
      odoo/addons/sale/__manifest__.py prove they are two trees, not an overlay. For the ~599
      modules in both, odoo/addons wins because it comes first on the path; the 63 modules
      saas-19.4 deleted stay discoverable from the stale tree. Those leftovers are also
      PARTIAL - hr_homeworking kept __manifest__.py and models/ but lost security/ and views/ -
      which is why it fails on a missing file rather than merely being out of date.
    measured:
      stale_in_addons: 63        # in the image, absent at saas-19.4 (incl. 34 theme_*, hr_homeworking)
      missing_from_addons: 44    # at saas-19.4, absent from the stale tree (present in odoo/addons)
    ledger_correction: >
      phases.4.1.result.verified claimed "addon dirs 662 == ... (no stale 19.0 files)". That was a
      COUNT, and 63 stale minus 44 missing happens to land near the expected total. A count cannot
      see a stale or partially-stripped module; compare the NAME SETS per addons root.
    correction_2026_09_12: >
      Dropping the dir from --addons-path DOES NOT WORK, tried and measured. Both trees are
      portions of the `odoo.addons` implicit namespace package (neither has __init__.py), so
      Odoo's addons path is a _NamespacePath and the packaged tree is appended whatever the
      conf says - the log line just moves it to the end and hr_homeworking still loads. The
      workaround has to be at the filesystem layer: mount an empty dir over it, or empty it
      in the image.
    options:
      - "workaround: mount an empty dir over /usr/lib/python3/dist-packages/addons in
         run/demo20/compose.yml (odoo/addons alone is the complete saas-19.4 surface).
         No rebuild, covers the long-running service and `compose run --rm` one-offs."
      - "real fix: env-serie-image.sh empties or removes the packaged 19.0 addons tree; rebuild
         the image. Shared - affects demo20/demo20e and every group."
    status: fixed
    fix: >
      lib/serie-core.Dockerfile empties dist-packages/addons after the core copy (leaving a
      README that says why) and asserts it holds no module directory; env-serie-image.sh
      asserts the same on the built image and prints the baked addon count. Rebuilt
      2026-09-12 at the pinned SHA (branch tip still equalled the pin, so the same source
      was tested).
    verified: >
      Image odoo/addons name set == `git ls-tree origin/saas-19.4:addons` +
      `:odoo/addons` exactly: 662 each, 0 stale, 0 missing. hr_homeworking absent from every
      root. Gx.6 then went 14/14 including complementary_employee_data.
    assertion_lesson: >
      Compare NAME SETS per addons root, never a count. The original 4.1 check was a count,
      and 63 stale against 44 missing landed near the expected total.

